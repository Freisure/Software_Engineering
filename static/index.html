<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />

    <meta name="theme-color" content="#214c69" />
    <title>书循环 · 校园教材流转</title>
    <link rel="icon" href="/static/logo.svg" type="image/svg+xml" />

  <body>

          class="icon"
          id="close-modal"
